site_name: Griglia
site_description: A Livewire dev board where you queue work for a coding agent and follow it live
site_author: Alessandro (alle80)
site_url: https://alle80.github.io/griglia/
repo_url: https://github.com/alle80/griglia
repo_name: alle80/griglia
edit_uri: edit/master/docs/
copyright: MIT — Alessandro (alle80)
docs_dir: docs
site_dir: site
hooks:
  - docs_hooks.py

theme:
  name: material
  custom_dir: overrides
  language: en
  font:
    text: JetBrains Mono
    code: JetBrains Mono
  logo: images/logo.svg
  favicon: images/favicon.png
  icon:
    repo: fontawesome/brands/github
  features:
    # navigation.instant is off on purpose: mkdocs-static-i18n cannot make the language switcher
    # point at the same page in the other language while instant loading is on (it warns, and the
    # site builds with --strict). Landing on the page you were reading is worth more than the SPA feel.
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/griglia.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/alle80/griglia
      name: Griglia on GitHub

plugins:
  # The site is bilingual: English pages are `page.md`, Italian ones `page.it.md` next to them
  # (docs_structure: suffix). Pages with no `.it.md` fall back to the English one, so a missing
  # translation is never a broken link. See docs/contributing/translations.md.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: it
          name: Italiano
          build: true
          site_name: Griglia
          site_description: Una board Livewire dove metti in coda il lavoro per il tuo agente e lo segui dal vivo
          nav_translations:
            Home: Home
            Getting started: Per cominciare
            Installation: Installazione
            Quickstart: Primi cinque minuti
            Front-end assets: Asset front-end
            Using the board: Usare la board
            The agent side: Il lato agente
            Skills: Skill
            Agent context: Contesto dell'agente
            Statistics & agents status: Statistiche e stato degli agenti
            Host scripts: Script sull'host
            Persistent workers: Worker persistenti
            Two agents at once: Due agenti insieme
            Features: Funzioni
            Plans: Piani
            Notifications: Notifiche
            Themes: Temi
            AI features: Funzioni AI
            Configuration: Configurazione
            Access, administrators and modes: Accessi, amministratori e modalità
            Reference: Reference
            Artisan commands: Comandi artisan
            Configuration file: File di configurazione
            Settings: Impostazioni
            Events and broadcasting: Eventi e broadcasting
            Changelog: Changelog
            Settings backlog: Impostazioni da fare
            FAQ: Domande frequenti
            Glossary: Glossario
            Operations: Esercizio
            Security: Sicurezza
            'Security assessment (2026-08-21)': 'Valutazione di sicurezza (21-08-2026)'
            Upgrading: Aggiornare
            Troubleshooting: Se qualcosa non va
            Contributing: Contribuire
            Governance: Governance
            License: Licenza
            Development: Sviluppo
            Building this site: Costruire questo sito
            Translations: Traduzioni
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Front-end assets: getting-started/assets.md
  - Using the board: board/usage.md
  - The agent side:
      - agent/index.md
      - Skills: agent/skills.md
      - Agent context: agent/context.md
      - Statistics & agents status: agent/stats.md
      - Host scripts: agent/scripts.md
      - Persistent workers: agent/workers.md
      - Two agents at once: agent/concurrency.md
  - Features:
      - features/index.md
      - Plans: features/plans.md
      - Notifications: features/notifications.md
      - Themes: features/themes.md
      - AI features: features/ai.md
  - Configuration:
      - configuration/index.md
      - Access, administrators and modes: configuration/access.md
  - Reference:
      - Artisan commands: reference/commands.md
      - Configuration file: reference/config.md
      - Settings: reference/settings.md
      - Events and broadcasting: reference/events.md
      - Changelog: reference/changelog.md
  - FAQ: faq.md
  - Glossary: glossary.md
  - Operations:
      - Security: operations/security.md
      - Upgrading: operations/upgrading.md
      - Troubleshooting: operations/troubleshooting.md
  - Contributing:
      - Governance: contributing/governance.md
      - Contributing: contributing/contributing.md
      - License: contributing/license.md
      - Development: contributing/development.md
      - Building this site: contributing/docs-site.md
      - Translations: contributing/translations.md
