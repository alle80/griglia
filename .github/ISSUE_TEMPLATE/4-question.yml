name: Question
description: Something is unclear about installing, configuring or using the board.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        There is no forum: questions are issues, and the answer usually becomes a documentation page. Please
        read the [FAQ](https://alle80.github.io/griglia/faq/) and the
        [troubleshooting page](https://alle80.github.io/griglia/operations/troubleshooting/) first — that is
        where the first questions live.
  - type: checkboxes
    id: homework
    attributes:
      label: Before you ask
      options:
        - label: I read the FAQ and the troubleshooting page, and searched the [existing issues](https://github.com/alle80/griglia/issues?q=is%3Aissue).
          required: true
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do
      description: The goal, not only the step you are stuck on — often there is a shorter way.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: Commands, settings, configuration values, and what came out.
      render: shell
  - type: input
    id: versions
    attributes:
      label: Griglia, Laravel and PHP versions, and the mode
      placeholder: Griglia 0.89.9, Laravel 13.2, PHP 8.4, server mode
    validations:
      required: true
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of conduct
      options:
        - label: I agree to follow this project's [code of conduct](https://github.com/alle80/griglia/blob/master/CODE_OF_CONDUCT.md).
          required: true
