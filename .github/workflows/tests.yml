name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# The workflow only reads the repository: nothing here publishes, comments or tags. Declaring it makes the
# default token read-only even if the repository default is permissive, which is what a fork's pull request
# runs with.
permissions:
  contents: read

# A new push to the same branch makes the running matrix pointless: cancel it instead of paying for it.
# Never on master, where a cancelled run would leave the branch without a verdict.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, intl, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with="orchestra/testbench:${{ matrix.testbench }}"

      - name: Run tests
        run: vendor/bin/phpunit

      # The reference pages of the docs are generated from the code: fail when they were not refreshed.
      - name: Check the generated documentation
        run: |
          vendor/bin/testbench griglia:docs-generate --check || {
            vendor/bin/testbench griglia:docs-generate --out=/tmp/generated
            diff -u docs/reference /tmp/generated || true
            exit 1
          }

  prefer-lowest:
    name: Prefer lowest dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, intl, fileinfo
          coverage: none
      - name: Install lowest supported dependencies
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress --with="orchestra/testbench:^10.0"
      - name: Run tests
        run: vendor/bin/phpunit

  lint:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, intl, fileinfo
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run lint and static analysis
        run: composer lint

  mysql:
    name: MySQL 8
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: griglia_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, gd, zip, intl, fileinfo
          coverage: none
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with="orchestra/testbench:^11.0"
      - name: Run tests
        env:
          GRIGLIA_TEST_DB: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: griglia_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/phpunit

  security:
    name: Composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, intl, fileinfo
          coverage: none
      - name: Resolve dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Audit dependencies
        run: composer audit
